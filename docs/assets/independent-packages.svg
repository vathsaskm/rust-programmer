<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="552" viewBox="0 0 1280 552" role="img" aria-labelledby="title desc">
  <title id="title">Rust Engineer and Rust Skills are independent packages</title>
  <desc id="desc">Rust Engineer contains an engineering workflow and reference map. Rust Skills contains focused guidance and examples. Each has its own content and license and installs independently.</desc>
  <rect width="1280" height="552" rx="24" fill="#0d141d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="72" fill="#f4f7fb" font-size="34" font-weight="700">Independent by design.</text>
    <text x="64" y="111" fill="#a8b6c6" font-size="20">Choose the agent or the skill. Each package is complete on its own.</text>
    <rect x="64" y="156" width="552" height="298" rx="18" fill="#17212d" stroke="#394656"/>
    <rect x="664" y="156" width="552" height="298" rx="18" fill="#17212d" stroke="#394656"/>
    <rect x="64" y="156" width="552" height="6" rx="3" fill="#f89b72"/>
    <rect x="664" y="156" width="552" height="6" rx="3" fill="#68d6c2"/>
    <text x="96" y="203" fill="#f89b72" font-size="14" font-weight="700" letter-spacing="2">AGENT WORKFLOW</text>
    <text x="696" y="203" fill="#68d6c2" font-size="14" font-weight="700" letter-spacing="2">SKILL</text>
    <text x="96" y="251" fill="#f4f7fb" font-size="34" font-weight="700">Rust Engineer</text>
    <text x="696" y="251" fill="#f4f7fb" font-size="34" font-weight="700">Rust Skills</text>
    <circle cx="102" cy="289" r="4" fill="#f89b72"/>
    <circle cx="102" cy="327" r="4" fill="#f89b72"/>
    <circle cx="102" cy="365" r="4" fill="#f89b72"/>
    <circle cx="702" cy="289" r="4" fill="#68d6c2"/>
    <circle cx="702" cy="327" r="4" fill="#68d6c2"/>
    <circle cx="702" cy="365" r="4" fill="#68d6c2"/>
    <text x="120" y="296" fill="#d3dde8" font-size="20">Understand the code and the task</text>
    <text x="120" y="334" fill="#d3dde8" font-size="20">Implement a focused change</text>
    <text x="120" y="372" fill="#d3dde8" font-size="20">Verify and explain the outcome</text>
    <text x="720" y="296" fill="#d3dde8" font-size="20">Find focused Rust guidance</text>
    <text x="720" y="334" fill="#d3dde8" font-size="20">Explore examples and alternatives</text>
    <text x="720" y="372" fill="#d3dde8" font-size="20">Reason about concrete tradeoffs</text>
    <rect x="96" y="399" width="488" height="30" rx="8" fill="#263342"/>
    <rect x="696" y="399" width="488" height="30" rx="8" fill="#263342"/>
    <text x="112" y="420" fill="#bac8d8" font-size="14">Instructions + reference map + license</text>
    <text x="712" y="420" fill="#bac8d8" font-size="14">Guidance index + examples + license</text>
    <text x="640" y="505" text-anchor="middle" fill="#a8b6c6" font-size="18">Separate downloads. Separate installation. Complete supporting content.</text>
  </g>
</svg>
