<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="272" viewBox="0 0 1280 272" role="img" aria-labelledby="title desc">
  <title id="title">From a Rust request to a verified result</title>
  <desc id="desc">Check repository constraints, read applicable rules and version-matched official documentation, choose an approach, implement the change, and verify the result. The agent explains its findings and the checks performed.</desc>
  <rect width="1280" height="272" rx="24" fill="#0d141d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="54" fill="#f4f7fb" font-size="28" font-weight="700">From request to verified result</text>
    <g fill="#17212d" stroke="#394656">
      <rect x="48" y="88" width="264" height="140" rx="16"/>
      <rect x="354" y="88" width="264" height="140" rx="16"/>
      <rect x="660" y="88" width="264" height="140" rx="16"/>
      <rect x="966" y="88" width="264" height="140" rx="16"/>
    </g>
    <g fill="none" stroke="#718297" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M324 157 H342 M335 150 L342 157 L335 164"/>
      <path d="M630 157 H648 M641 150 L648 157 L641 164"/>
      <path d="M936 157 H954 M947 150 L954 157 L947 164"/>
    </g>
    <g fill="#f89b72" font-size="14" font-weight="700" letter-spacing="1.5">
      <text x="72" y="121">EVIDENCE GATE</text>
      <text x="378" y="121">DESIGN</text>
      <text x="684" y="121">IMPLEMENTATION</text>
      <text x="990" y="121" fill="#68d6c2">VERIFICATION</text>
    </g>
    <g fill="#f4f7fb" font-size="24" font-weight="700">
      <text x="72" y="160">Understand</text>
      <text x="378" y="160">Choose</text>
      <text x="684" y="160">Build</text>
      <text x="990" y="160">Check</text>
    </g>
    <g fill="#a8b6c6" font-size="16">
      <text x="72" y="193">Read code, rules and docs</text>
      <text x="378" y="193">Explain the tradeoffs</text>
      <text x="684" y="193">Make a focused change</text>
      <text x="990" y="193">Report tested behavior</text>
    </g>
  </g>
</svg>
