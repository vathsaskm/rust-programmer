name: Validate packages and scan secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate independent packages
        run: python3 scripts/verify_release.py
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-scan"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/rust-scan/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/rust-scan/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/rust-scan/gitleaks.tar.gz" -C "$RUNNER_TEMP/rust-scan" gitleaks
      - name: Scan published files and Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rust-scan/gitleaks" dir . --redact --ignore-gitleaks-allow --no-banner
          "$RUNNER_TEMP/rust-scan/gitleaks" git . --redact --ignore-gitleaks-allow --no-banner
